# tracker-schema-core.yaml: the Core tracker's tabs, columns and statuses.
#
# Source of truth for the tracker that the Core plugin builds from scratch
# with the Drive and Sheets connectors (decisions 028 and 032). Change this
# file first and the sheet second.
#
# Column and value names reuse templates/tracker-schema.yaml (the Pipeline
# layout) wherever they exist, so a Core sheet can be extended later.
#
# Rules for the sheet built from this schema:
# - Column order is fixed. Skills find columns by header name anyway.
# - Keep every tab a plain range. Do not convert a tab to a Google Sheets
#   table: typed table columns reject writes.
# - Dates are text in YYYY-MM-DD.
#
# Versioning (decision 032): core_schema_version in the hidden Config tab.
# Allowed without a migration: appending columns at the right, adding a
# status, adding a tab. Needs a migration: renaming or removing a column or
# tab, or changing what a status means.

core_schema_version: 1

statuses:
  # Leads statuses. A rejection is not a Leads status: it is recorded as
  # Outcome = Rejected on the Applications tab.
  - name: Drafting
    meaning: Posting captured, resume and cover letter in progress, or a draft that still has blockers.
    set_by: apply skill (draft mode)
  - name: Ready
    meaning: Draft passed every blocking check. The user reads, edits and applies on their own.
    set_by: apply skill (draft mode)
  - name: Applied
    meaning: The user says they submitted. Copies a row to Applications.
    set_by: apply skill (log mode)
  - name: Skipped
    meaning: The user passes, or the posting was not processed because it looked like an injection attempt. Skip reason says which.
    set_by: apply skill (log and draft modes)
  - name: Parked
    meaning: The user wants to come back later. Follow-up date is optional.
    set_by: apply skill (log mode)
  - name: Closed
    meaning: The posting is gone or no longer accepting applications.
    set_by: apply skill (log mode)

tabs:
  - name: Leads
    purpose: Every job the user has asked Claude to draft for, one row per job.
    columns:
      - {name: Lead ID, type: text, set_by: system, note: "L-YYYYMMDD-NNN. Links Leads to Applications and folders."}
      - {name: Date found, type: date, set_by: system, note: "The day the row was created."}
      - {name: Title, type: text, set_by: system}
      - {name: Employer, type: text, set_by: system}
      - {name: Location, type: text, set_by: system}
      - {name: Work mode, type: enum, values: [remote, hybrid, onsite, unknown], set_by: system}
      - {name: Pay, type: text, set_by: system, note: "As listed. Blank if not listed."}
      - {name: Link, type: url, set_by: system, note: "The posting the user supplied."}
      - {name: Flags, type: text, set_by: system, note: "Semicolon-separated. Includes any text in the posting aimed at an AI (decision 009)."}
      - {name: Status, type: enum, values_from: statuses, set_by: system and user, note: "Strict dropdown."}
      - {name: Status date, type: date, set_by: system, note: "When Status last changed."}
      - {name: Skip reason, type: text, set_by: system and user}
      - {name: Draft folder, type: url, set_by: system, note: "Dated folder in Applications with posting.md, resume, cover letter and review.json."}
      - {name: Review result, type: enum, values: [Pass, Blocked, Not reviewed], set_by: system}
      - {name: Next action, type: text, set_by: system, note: "One plain line telling the user what to do, from the table in shared/tracker.md. Blank when nothing is needed."}
      - {name: Deadline, type: date, set_by: system and user}
      - {name: Follow-up date, type: date, set_by: user, note: "Used by Parked."}
      - {name: Notes, type: text, set_by: user}

  - name: Applications
    purpose: One row per submitted application, copied from Leads when Status becomes Applied. Used for outcome tracking.
    columns:
      - {name: Lead ID, type: text, set_by: system}
      - {name: Date applied, type: date, set_by: user, note: "Defaults to the day the status changed."}
      - {name: Employer, type: text, set_by: system}
      - {name: Title, type: text, set_by: system}
      - {name: Link, type: url, set_by: system}
      - {name: Channel, type: enum, values: [Employer site, Job board, Referral, Recruiter, Email, Other], set_by: user}
      - {name: Referral or contact, type: text, set_by: user}
      - {name: Pay, type: text, set_by: system}
      - {name: Folder, type: url, set_by: system}
      - {name: Resume, type: url, set_by: system, note: "The version the user submitted, if saved back to the folder."}
      - {name: Cover letter, type: url, set_by: system}
      - {name: Stage reached, type: enum, values: [Applied, Screen, Interview, Final round, Offer, Accepted], set_by: user}
      - {name: Outcome, type: enum, values: [Open, Rejected, Withdrawn, No response, Declined offer, Hired], set_by: user}
      - {name: First response date, type: date, set_by: user}
      - {name: Next step date, type: date, set_by: user}
      - {name: Notes, type: text, set_by: user}

# Hidden. Key and value in two columns. Users do not edit it.
hidden_tabs:
  - name: Config
    columns:
      - {name: Key, type: text}
      - {name: Value, type: text}
    keys:
      - core_schema_version
      - profile_folder_id

# What onboarding builds (checked in a live test on 2026-11-17, except hiding a tab).
formatting:
  header_row: bold, light gray fill, frozen
  status_column: "strict dropdown with the six statuses; colors: green Applied, yellow Ready or Parked, gray Skipped or Closed"
  other_dropdowns: [Work mode, Review result, Channel, Stage reached, Outcome]
  widths: wider for Title, Employer, Notes and Next action
