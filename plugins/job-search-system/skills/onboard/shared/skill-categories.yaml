# skill-categories.yaml: the category presets for the Skills section.
#
# A skill's category is part of the confirmed fact (decision 023). In
# facts.md, skills sit under ### headings inside "## Skills and tools", one
# heading per category, using the labels below. profile.yaml names the
# user's preset in skills_preset.
#
# Who reads this:
# - Onboarding (step 3) proposes a category from the user's preset for each
#   skill, and the user accepts it or moves it.
# - The reviewer judges wrong_category against "means" and "not".
# - The drafter does not need it: the labels come from the headings in
#   facts.md.
#
# Fields for each category:
#   key       stable id, never shown to anyone
#   label     the heading in facts.md and the label on the resume line
#   means     one line on what belongs here
#   examples  items that belong
#   not       items people often put here that belong somewhere else, with
#             where they go
#
# Rules for all presets:
# - No soft-skill category ("communication", "leadership"). Show those
#   through results and stories, not a skills line.
# - Certifications and licenses are not skills. They stay in the
#   "Education, licenses and certifications" section of facts.md.
# - A user may add a category that is not in their preset. It is a ###
#   heading like any other, and the reviewer judges it by the plain meaning
#   of its name.
# - Add a new preset only when someone needs it.

schema_version: 1

presets:
  tech:
    description: Software, data and infrastructure work.
    categories:
      - key: languages
        label: Languages
        means: Programming, query and markup languages you write code in.
        examples: [Python, PHP, JavaScript, TypeScript, Go, Java, SQL, Bash]
        not:
          - "RabbitMQ: a message broker, so Cloud, Infrastructure and Services"
          - "React: a library, so Frameworks and Libraries"
          - "Spanish: a spoken language, so Other facts in facts.md"
      - key: frameworks
        label: Frameworks and Libraries
        means: Frameworks and libraries you build on, inside a language.
        examples: [React, Django, Laravel, Spring Boot, Node.js, pandas]
        not:
          - "JavaScript: a language, so Languages"
          - "PostgreSQL: a database, so Databases and Data Stores"
      - key: data_stores
        label: Databases and Data Stores
        means: Databases, caches, search engines and warehouses that hold data.
        examples: [PostgreSQL, MySQL, Redis, Elasticsearch, Snowflake, DynamoDB]
        not:
          - "SQL: a language, so Languages"
          - "Kafka: a streaming service, so Cloud, Infrastructure and Services"
      - key: infrastructure
        label: Cloud, Infrastructure and Services
        means: Cloud platforms, hosting, message brokers, and the services and infrastructure code that run software.
        examples: [AWS, Google Cloud, Kubernetes, Docker, Terraform, RabbitMQ, Kafka]
        not:
          - "GitHub Actions: a CI tool, so Tools"
          - "Python: a language, so Languages"
      - key: tools
        label: Tools
        means: Software you use to build, test, ship, track or observe work, rather than software your product runs on.
        examples: [Git, GitHub Actions, Jenkins, Jira, Datadog, Postman, VS Code]
        not:
          - "Python: a language, so Languages"
          - "RabbitMQ: a message broker, so Cloud, Infrastructure and Services"
          - "Scrum: a method, so Practices"
      - key: practices
        label: Practices
        means: Methods and ways of working you can describe and defend in an interview.
        examples: [Code review, Test-driven development, CI/CD, Incident response, Scrum, API design]
        not:
          - "Leadership: a soft skill, so show it in results instead"
          - "Jenkins: a tool, so Tools"

  general:
    description: Most other work, including operations, health care, finance, education and the trades.
    categories:
      - key: software
        label: Software and Systems
        means: Software, platforms, equipment systems and technical tools you use in the work, including query tools such as SQL.
        examples: [Excel, Salesforce, QuickBooks, Epic, SAP, SQL, Omnicell]
        not:
          - "Inventory control: a method, so Methods and Practices"
          - "Spanish: a spoken language, so Languages"
      - key: methods
        label: Methods and Practices
        means: Methods, processes and ways of working you can describe and defend in an interview.
        examples: [Cycle counting, Lean, Root cause analysis, Project scheduling, Bookkeeping]
        not:
          - "Excel: software, so Software and Systems"
          - "Teamwork: a soft skill, so show it in results instead"
      - key: domain
        label: Domain Knowledge
        means: Rules, programs, regulations and subject areas you know well enough to work in.
        examples: [340B program, HIPAA, GAAP, Medicare billing, OSHA safety rules]
        not:
          - "QuickBooks: software, so Software and Systems"
          - "CPA license: a credential, so Education, licenses and certifications"
      - key: languages
        label: Languages
        means: Spoken and signed languages, with your level.
        examples: [Conversational Spanish, Fluent French, American Sign Language]
        not:
          - "SQL: a query tool, so Software and Systems"
